[package]
name = "nebula-gpui"
version = "0.1.0"
license = "GPL-3.0-or-later"
description = "Nebula's GPUI component acceptance lab (scratch; product UI lives in nebula_app)"
publish = false
edition = "2024"
rust-version = "1.97.1"

# lib + bin 双形态：bin 是组件验收入口；产品 GPUI UI 层已迁入
# nebula_app/src/gpui_shell/（feature = "gpui-shell"），本 crate 不再承载。
[lib]
name = "nebula_gpui"
path = "src/lib.rs"

[[bin]]
name = "nebula-gpui"
path = "src/main.rs"

[dependencies]
# 精确 Git 来源与 rev 由工作区根清单统一固定。
gpui = "=0.2.2"
gpui_platform.workspace = true
gpui-component = "=0.5.2"
gpui-component-assets = "=0.5.1"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
