[package]
name = "nebula-gpui"
version = "0.1.0"
license = "GPL-3.0-or-later"
description = "Nebula's GPUI application foundation and component acceptance surface"
publish = false
edition = "2024"
rust-version = "1.85.0"

[[bin]]
name = "nebula-gpui"
path = "src/main.rs"

[dependencies]
gpui = "=0.2.2"
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
# 终端核心是纯 Rust（vte/grid/ConPTY），没有 GUI 原生依赖，因此可以跨 workspace
# 边界直接 path 引用而不会重新引入 fontconfig links 冲突。
nebula_terminal = { path = "../nebula_terminal" }
futures = "0.3"
# 读取用户 nebula.toml 的字体/配色子集；版本与主仓保持一致。
serde = { version = "1", features = ["derive"] }
toml = "0.9"
dirs = "6.0.0"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
