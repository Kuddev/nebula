[workspace]
members = [
    "nebula_app",
    "nebula_terminal",
    "nebula_config",
    "nebula_config_derive",
    "nebula-completions",
    "nebula_hook",
    "nebula_gpui",
    "nebula_settings",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85.0"

[profile.release]
lto = "thin"
debug = 0
strip = "debuginfo"
incremental = false

[workspace.dependencies]
mlua = { version = "0.11.4", features = ["lua54", "vendored", "serialize", "send"] }
serde_path_to_error = "0.1.20"
toml = "0.9.11"
toml_edit = "0.24.0"

# TODO: Drop this pin and return to the crates.io release once the fix ships there.
[patch.crates-io]
x11-clipboard = { git = "https://github.com/quininer/x11-clipboard.git", rev = "19ab2163cf0bd0db607e827a5214571990307866" }
# Keep the 0.30.13 API/rwh_06 surface while backporting winit upstream
# 488c036a's Windows 11 mixed-DPI positioning fix. The upstream revision has
# since moved to a different EventLoop API and cannot be used directly here.
winit = { path = "third_party/winit-0.30.13" }
