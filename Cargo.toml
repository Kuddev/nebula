[workspace]
members = [
    "nebula_app",
    "nebula_terminal",
    "nebula_config",
    "nebula_config_derive",
    "nebula-completions",
    "nebula_hook",
    "nebula_gpui",
    "nebula_settings",
    "nebula_split",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85.0"

[profile.release]
lto = "thin"
debug = 0
strip = "debuginfo"
incremental = false

[workspace.dependencies]
mlua = { version = "0.11.4", features = ["lua54", "vendored", "serialize", "send"] }
serde_path_to_error = "0.1.20"
toml = "0.9.11"
toml_edit = "0.24.0"

# TODO: Drop this pin and return to the crates.io release once the fix ships there.
[patch.crates-io]
x11-clipboard = { git = "https://github.com/quininer/x11-clipboard.git", rev = "19ab2163cf0bd0db607e827a5214571990307866" }
# Keep the 0.30.13 API/rwh_06 surface while backporting winit upstream
# 488c036a's Windows 11 mixed-DPI positioning fix. The upstream revision has
# since moved to a different EventLoop API and cannot be used directly here.
winit = { path = "third_party/winit-0.30.13" }

# ---- gpui / gpui-component fork（C 路线，nebula_gpui）----------------------
#
# 版本配对（发布线）：gpui-component 0.5.1（含 -assets / -macros）编译在
# crates.io 的 gpui 0.2.2 上——longbridge 仓库 v0.5.1 的 workspace 依赖就是
# `gpui = "0.2.2"`，不是 zed git。nebula_gpui/Cargo.toml 用 "=0.2.2" /
# "=0.5.1" 精确 pin；[patch] 要求版本匹配，fork 上的版本号保持不动。
#
# 下面两个 fork 的 `nebula` 分支基于 crates.io 发布基点（读自 registry 包内
# 的 .cargo_vcs_info.json，包名/版本已在基点 rev 上核对过），当前补丁栈为空，
# 构建产物应与 crates.io 版本一致：
#   Kuddev/zed            nebula @ 69e2130295c2649963eb639fc70b4f2ee8ea1624
#                         （= zed-industries/zed 发布 gpui 0.2.2 的 rev，
#                         crates/gpui；上游发布时 dirty=true，若首次编译出现
#                         与 registry src 的差异以 diff 为准补一个对齐 commit）
#   Kuddev/gpui-component nebula @ 0f0ab35233212f8f3277028995caf0c41e13ee6c
#                         （= longbridge/gpui-component v0.5.1，crates/ui；
#                         上级目录 gpui-component-v0.5.1/ 有源码检出可对照）
#
# 加补丁 = 提交到 fork 的 nebula 分支 → push → 更新下面的 rev（永远 pin
# exact rev、不 pin branch）。每个补丁注明原因 + upstream PR 链接，上游合并
# 即撤；升级配对版本 = rebase nebula 分支到新发布基点（参照 ../tty7 的
# Cargo.toml 注释风格与守护测试做法）。gpui 的仓内兄弟 crate（gpui_macros、
# sum_tree、zed-reqwest 等）经 git 仓库内 path 依赖自动解析，无需逐个 patch。
#
# 升级基点到 gpui-component 0.5.2+ 时的回归检查单（2026-08-13 对照
# l0ng-ai/gpui-component 的 tty7 分支得出；0.5.1 上这些行为本来是对的，
# 是 0.5.2 重构 button 颜色推导时弄丢的，届时把 tty7 的两个 fix 带上）：
#   1. ButtonVariant::Custom 的 text_color 必须回 colors.foreground（0.5.2
#      回归成背景色 colors.color，透明底按钮字直接隐形）→ tty7 3826fafacd3c
#   2. hovered()/active() 必须读 ButtonCustomVariant::hover/active（0.5.2
#      回归成从 color 派生，透明底按钮没有任何悬停/按下反馈）→ 469ab7a44f72
#   3. 新增的 text/inline_flow.rs：shape_line 前把 \n\r 换成空格（gpui
#      shaper 遇换行 panic；替换保 byte 长度，run 偏移不失效）
# 本地 fork 工作拷贝在 ../gpui-component-fork（已挂 tty7 remote 可 diff）。
gpui = { git = "https://github.com/Kuddev/zed", rev = "69e2130295c2649963eb639fc70b4f2ee8ea1624" }
gpui-component = { git = "https://github.com/Kuddev/gpui-component", rev = "0f0ab35233212f8f3277028995caf0c41e13ee6c" }
gpui-component-assets = { git = "https://github.com/Kuddev/gpui-component", rev = "0f0ab35233212f8f3277028995caf0c41e13ee6c" }
