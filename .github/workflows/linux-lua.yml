name: Linux Lua configuration

on:
  # Lua/config tests run in the affected product suite on all four platforms.
  # Retain the explicit legacy-shell compatibility check as a weekly/manual job.
  workflow_dispatch:
  schedule:
    - cron: "41 21 * * 0"

permissions:
  contents: read

concurrency:
  group: linux-legacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-24-04:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libasound2-dev libdbus-1-dev libudev-dev \
            libfontconfig1-dev libfreetype6-dev \
            libegl1-mesa-dev libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xinput-dev libxcb-xkb-dev libxi-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: legacy-ci-v1-${{ hashFiles('.github/ci-profile.toml') }}
          cache-workspace-crates: true
          cache-bin: false
      - name: Test Lua configuration on Wayland and X11 build
        run: |
          cargo test --locked --config .github/ci-profile.toml --profile ci \
            -p nebula --no-default-features --features legacy-shell config::
      - name: Check Linux release build
        run: cargo check --workspace --release
