# Screen-chrome evidence for this CLI (idle / working / blocked).
id = "devin"
aliases = ["devin-cli"]

[[rules]]
id = "workspace_trust_prompt"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(8)"
contains = ["do you trust the authors of this directory?", "with untrusted content."]

[[rules]]
id = "permission_prompt"
state = "blocked"
priority = 290
region = "bottom_non_empty_lines(8)"
contains = ["approve once", "select", "confirm", "esc cancel"]

[[rules]]
id = "running_tools_footer"
state = "working"
priority = 200
region = "bottom_non_empty_lines(8)"
contains = ["running tools", "esc to interrupt"]
not = [{ contains = ["approve once", "esc cancel"] }]

[[rules]]
id = "guide_while_working"
state = "working"
priority = 190
region = "bottom_non_empty_lines(6)"
contains = ["guide devin while it works"]
not = [{ contains = ["approve once", "esc cancel"] }]

[[rules]]
id = "live_prompt_footer"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(6)"
contains = ["context:"]
line_regex = ['^\s*❭']
not = [
  { contains = ["approve once", "esc cancel"] },
  { contains = ["running tools", "esc to interrupt"] },
  { contains = ["guide devin while it works"] },
]
